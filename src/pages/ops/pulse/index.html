<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>読まれ方の集計(管理者用)</title>
<style>
body{margin:0;background:#0B0B0B;color:#E6E0D2;font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.8}
main{max-width:960px;margin:0 auto;padding:32px 16px 96px}
h1{font-size:24px;margin:0 0 8px} h2{font-size:18px;margin:40px 0 10px;color:#C9AA6E;border-top:1px solid #3A3A3A;padding-top:20px}
input,button{font:inherit;min-height:44px;padding:0 14px;background:#141414;color:#E6E0D2;border:1px solid #C9AA6E}
button{cursor:pointer} input{min-width:min(100%,320px)}
.wrap{overflow-x:auto} table{border-collapse:collapse;min-width:100%;font-size:15px}
th,td{border-bottom:1px solid #2A2A2A;padding:6px 10px;text-align:left;white-space:nowrap} th{color:#BDB7A9;font-weight:400}
td.n{text-align:right} p.note{font-size:14px;color:#BDB7A9}
</style>
</head>
<body>
<main>
<h1>読まれ方の集計</h1>
<p class="note">管理者用です。合言葉(STATS_TOKEN)を入れると、記事ごとの数字が出ます。合言葉はこのタブを閉じると忘れます。</p>
<p class="note"><a href="/ops/gbp/" style="color:#C9AA6E">Googleビジネスプロフィール用の投稿文の下書き →</a></p>
<form id="f"><input id="t" type="password" autocomplete="off" placeholder="合言葉" aria-label="合言葉"> <button type="submit">表示</button></form>
<p id="msg" class="note" role="status"></p>
<div id="out"></div>
</main>
<script>
(function () {
  var out = document.getElementById('out'), msg = document.getElementById('msg'), t = document.getElementById('t');
  var CH = { good: '役に立った', more: 'もっと知りたい', off: 'ちょっと違う' };
  var MOOD = { refresh: 'スッキリ', savor: 'ゆっくり味わう', adventure: '冒険', fun: '盛り上がる' };
  function el(tag, text, cls) { var e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }
  function elS(tag, text, css) { var e = document.createElement(tag); if (text != null) e.textContent = text; if (css) e.setAttribute('style', css); return e; }
  function table(head, rows) {
    var w = el('div', null, 'wrap'), tb = el('table'), tr = el('tr');
    head.forEach(function (h) { tr.appendChild(el('th', h)); }); tb.appendChild(tr);
    rows.forEach(function (r) { var x = el('tr'); r.forEach(function (c) { x.appendChild(el('td', c, typeof c === 'number' ? 'n' : '')); }); tb.appendChild(x); });
    w.appendChild(tb); return w;
  }
  function section(title, node, note) { out.appendChild(el('h2', title)); if (note) out.appendChild(el('p', note, 'note')); out.appendChild(node); }
  function render(d) {
    out.textContent = '';
    // ---- 単純なアクセス数(日別・時間帯別・曜日別・日×時間)
    function bars(rows, label, val, max, unit) {
      var w = elS('div', null, 'display:flex;flex-direction:column;gap:3px');
      rows.forEach(function (r) {
        var line = elS('div', null, 'display:flex;align-items:center;gap:8px;font-size:14px');
        line.appendChild(elS('span', label(r), 'flex:0 0 7.5em;color:#BDB7A9;white-space:nowrap'));
        var bar = elS('span', null, 'height:14px;background:#C9AA6E;display:inline-block;min-width:1px'); bar.style.width = Math.max(1, Math.round(240 * val(r) / (max || 1))) + 'px';
        line.appendChild(bar); line.appendChild(elS('span', String(val(r)) + (unit || ''), 'white-space:nowrap'));
        w.appendChild(line);
      }); return w;
    }
    var daily = (d.daily || []);
    section('日別のアクセス数(新しい順・最大60日)', (function () {
      var box = elS('div'); box.appendChild(bars(daily, function (r) { return r.day; }, function (r) { return r.pv; }, Math.max.apply(null, daily.map(function (r) { return r.pv; })), ' 件'));
      box.appendChild(table(['日付', 'アクセス数', 'おおよその訪問数(タブ)'], daily.map(function (r) { return [r.day, r.pv, r.tabs]; })));
      return box;
    })(), '1回のページの読み込みを1件と数える(同じ人が3ページ見れば3件)。タブ=同じタブで見たものを1と数える、おおよその訪問数。「トラッキングしない」設定の端末と、JavaScriptを動かさないものは入らない。検索ロボットが混ざることがある。');
    var hrs = []; for (var h = 0; h < 24; h++) hrs.push({ h: h, n: 0 }); (d.hourly || []).forEach(function (r) { hrs[r.h].n = r.n; });
    section('時間帯別のアクセス数(直近30日の合計・日本時間)', bars(hrs, function (r) { return (r.h < 10 ? '0' : '') + r.h + '時台'; }, function (r) { return r.n; }, Math.max.apply(null, hrs.map(function (r) { return r.n; })), ' 件'), '時刻は、記録を始めた日(10月下旬)以降のぶんだけ。');
    var WD = ['日', '月', '火', '水', '木', '金', '土'], wd = []; for (var i = 0; i < 7; i++) wd.push({ w: i, n: 0, days: 0 }); (d.weekday || []).forEach(function (r) { wd[r.w] = r; });
    section('曜日別(直近90日・1日あたりの平均)', bars(wd, function (r) { return WD[r.w] + '曜日'; }, function (r) { return r.days ? Math.round(10 * r.n / r.days) / 10 : 0; }, Math.max.apply(null, wd.map(function (r) { return r.days ? r.n / r.days : 0; })), ' 件/日'));
    var heat = d.heat || [], days = []; heat.forEach(function (r) { if (days.indexOf(r.day) < 0) days.push(r.day); });
    var hm = {}; heat.forEach(function (r) { hm[r.day + '|' + r.h] = r.n; }); var hmax = Math.max.apply(null, [1].concat(heat.map(function (r) { return r.n; })));
    var ht = elS('table'), hr = elS('tr'); hr.appendChild(elS('th', '日付'));
    for (var k = 0; k < 24; k++) hr.appendChild(elS('th', String(k)));
    ht.appendChild(hr);
    days.forEach(function (day) { var tr = elS('tr'); tr.appendChild(elS('td', day.slice(5))); for (var k2 = 0; k2 < 24; k2++) { var n = hm[day + '|' + k2] || 0, td = elS('td', n ? String(n) : '', 'text-align:center;padding:3px 4px;font-size:12px;background:rgba(201,170,110,' + (n ? 0.12 + 0.75 * n / hmax : 0) + ');color:' + (n / hmax > 0.5 ? '#0B0B0B' : '#E6E0D2')); tr.appendChild(td); } ht.appendChild(tr); });
    var hw = elS('div', null, 'wrap'); hw.appendChild(ht);
    section('日×時間のアクセス数(直近14日・日本時間)', hw, '濃いほど多い。縦=日付、横=時(0〜23)。');
    var votes = {};
    d.votes.forEach(function (v) { (votes[v.path] = votes[v.path] || {})[v.choice] = v.n; });
    section('ページごとの閲覧', table(['ページ', '閲覧', '平均秒', '読み進め率'], d.pages.map(function (p) {
      return [p.path, p.n, p.avg_secs, p.total ? Math.round(100 * p.reached / p.total) + '%' : '―'];
    })), '「読み進め」は、見出しが画面の上のほうまで来た割合。読んだ証明ではないので、平均秒と合わせて見る。');
    var vr = Object.keys(votes).map(function (k) { return [k, votes[k].good || 0, votes[k].more || 0, votes[k].off || 0]; });
    section('記事末のボタン', table(['記事', CH.good, CH.more, CH.off], vr));
    var KN = { direct: '直接(ブックマーク・QRなど)', ext: '外のサイト', from: '目印(?from=)' };
    var CK = { shop: 'ショップ', ig: 'Instagram', fund: 'クラウドファンディング', map: '地図', tel: '電話', ext: 'その他の外部' };
    section('入口(どこから来たか)', table(['種類', '入口', '回数'], (d.entries || []).map(function (e) { return [KN[e.kind] || e.kind, e.val, e.n]; })), '外のサイトはドメイン名だけ。Instagramのアプリ内ブラウザなどは「直接」に入る。');
    section('ページ間の遷移(どのページから、どのページへ)', table(['から', 'へ', '回数'], (d.flows || []).map(function (f) { return [f.src, f.dst, f.n]; })));
    section('直接アクセスで入ったページ', table(['ページ', '回数'], (d.direct_pages || []).map(function (x) { return [x.path, x.n]; })), 'リファラーが無い入口(ブックマーク・QR・メッセージのリンク・アプリ内ブラウザ)。QRのURLに ?from=qr を付けると、「目印」に分かれる。');
    section('よくある順路(同じタブ・最大6ページ)', table(['順路', '件数'], (d.routes || []).map(function (r) { return [r.route, r.n]; })), 'タブを閉じれば切れる使い捨ての印でつなげた順路。同じ人の別の日・別のタブはつながらない。件数が少ないうちは、傾向として読まない。');
    section('外へ出るリンク・電話の押下', table(['ページ', '種類', '回数'], (d.clicks || []).map(function (c) { return [c.path, CK[c.kind] || c.kind, c.n]; })));
    var fr = d.finder_with_sid || {};
    section('ビール診断の結果ごとに、その前に同じタブで読んだ読みもの', table(['出たビール', '読んだ記事', '回数'], (d.finder_reads || []).map(function (x) { return [x.top, x.path, x.n]; })),
      '診断の回数 ' + (fr.n || 0) + ' 件のうち、同じタブの順路を見られたもの ' + (fr.s || 0) + ' 件。少ないうちは、傾向として読まない。タブを閉じれば切れる使い捨ての印でつなげていて、人は特定できない。');
    var VC = { learn: 'もっと知りたい', beer: 'これって何?', site: 'HPの感想', yagiriya: 'YAGIRIYA' };
    var vl = el('div', null, 'wrap');
    (d.voice || []).forEach(function (v) {
      var box = el('div'); box.setAttribute('style', 'border-bottom:1px solid #2A2A2A;padding:10px 0');
      box.appendChild(el('div', v.day + ' ／ ' + (VC[v.cat] || v.cat) + ' ／ ' + v.path, 'note'));
      var m = el('div', v.msg); m.style.whiteSpace = 'pre-wrap'; m.style.overflowWrap = 'anywhere'; box.appendChild(m); vl.appendChild(box);
    });
    if (!(d.voice || []).length) vl.appendChild(el('p', 'まだ届いていません。', 'note'));
    section('ご意見箱(新しい順・最大200件)', vl, '匿名で届いた文章です。個人情報が書かれていたら、D1 から該当の行を消してください。');
    section('ビール診断:気分ごとに出たビール', table(['気分', '出たビール', '回数'], d.finder.map(function (f) { return [MOOD[f.mood] || f.mood, f.top, f.n]; })));
    section('ビール診断:気温と雨ごとに出たビール', table(['気温', '雨', '出たビール', '回数'], d.weather.map(function (w) { return [w.temp_band, w.rain, w.top, w.n]; })),
      '気象は松戸に近い観測点(気象庁 AMeDAS)から1時間ごとに記録。記録済み ' + d.weather_rows + ' 時間分。診断の回数が少ないうちは、傾向として読まない。');
  }
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault(); msg.textContent = '読み込み中…';
    fetch('/api/stats', { headers: { Authorization: 'Bearer ' + t.value }, cache: 'no-store' }).then(function (r) {
      if (r.status === 401) throw new Error('合言葉が違います。');
      if (r.status === 503) return r.json().then(function (j) {
        throw new Error('Worker は動いていますが、STATS_TOKEN が見えていません。' + (j.near && j.near.length ? '似た名前は見えています: ' + JSON.stringify(j.near) + '(名前を確認)。' : '似た名前も見えません(「ビルド」ではなく実行時の変数に入れたか、どの Worker か、デプロイされたかを確認)。'));
      });
      if (r.status === 404) throw new Error('計測の Worker が動いていません(最新のデプロイが反映されていない可能性)。');
      if (!r.ok) throw new Error('取得できませんでした(' + r.status + ')。');
      return r.json();
    }).then(function (d) { msg.textContent = ''; try { sessionStorage.setItem('ops_token', t.value); } catch (e) { /* 保存できなくても動く */ } render(d); }).catch(function (er) { msg.textContent = er.message; });
  });
})();
</script>
</body>
</html>
